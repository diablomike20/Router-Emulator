name: Build Belkin F9K1103 v1 OpenWrt 23.05.5

on:
  push:
    branches:
      - f9k1103-openwrt-23.05.5-port
    paths:
      - 'ports/f9k1103/**'
      - '.github/workflows/f9k1103-openwrt-23.05.5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison g++ gawk gcc-multilib g++-multilib             gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig             unzip zlib1g-dev file wget python3 python3-dev libelf-dev time

      - name: Checkout OpenWrt 23.05.5
        run: |
          git clone --depth 1 --branch v23.05.5 https://github.com/openwrt/openwrt.git openwrt
          git -C openwrt rev-parse HEAD

      - name: Apply F9K1103 v1 board port
        run: |
          chmod +x ports/f9k1103/apply-openwrt-23.05.5.sh
          ports/f9k1103/apply-openwrt-23.05.5.sh openwrt
          grep -n -A14 -B2 'Device/belkin_f9k1103v1' openwrt/target/linux/ramips/image/rt3883.mk
          grep -n 'belkin,f9k1103v1' openwrt/target/linux/ramips/rt3883/base-files/etc/board.d/02_network

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure F9K1103 v1 with LuCI
        working-directory: openwrt
        run: |
          cp ../ports/f9k1103/config.seed .config
          cat >> .config <<'EOF'
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          echo '--- selected target ---'
          grep -E 'CONFIG_TARGET_ramips|CONFIG_TARGET_ramips_rt3883|CONFIG_PACKAGE_luci=' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s 2>&1 | tee ../f9k1103-build.log

      - name: Collect firmware
        if: always()
        run: |
          set -eux
          mkdir -p artifact
          cp ports/f9k1103/README.md artifact/PORT-README.md
          cp ports/f9k1103/rt3883_belkin_f9k1103v1.dts artifact/
          cp ports/f9k1103/apply-openwrt-23.05.5.sh artifact/
          cp openwrt/.config artifact/openwrt.config || true
          cp f9k1103-build.log artifact/ || true
          if [ -d openwrt/bin/targets/ramips/rt3883 ]; then
            find openwrt/bin/targets/ramips/rt3883 -maxdepth 1 -type f               \( -name '*belkin_f9k1103v1*' -o -name 'sha256sums' -o -name '*.manifest' -o -name 'profiles.json' \)               -exec cp -v {} artifact/ \;
          fi
          (
            cd artifact
            sha256sum * > F9K1103-ARTIFACT-SHA256SUMS.txt || true
          )
          cat > artifact/BUILD-STATUS.txt <<'EOF'
          Belkin F9K1103 v1 OpenWrt 23.05.5
          STATUS: PORT-WIP / NOT-PHYSICAL-ROUTER-VERIFIED
          Baseline: OpenWrt v23.05.5
          Board family: RT3883 / Belkin F9K110x
          Image name: N750F9K1103VB
          This artifact must not be described as runtime verified until tested on a physical F9K1103 v1.
          EOF
          ls -lah artifact

      - name: Upload F9K1103 firmware artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F9K1103-v1-OpenWrt-23.05.5-PORT-WIP
          path: artifact/
          if-no-files-found: error
          retention-days: 30
