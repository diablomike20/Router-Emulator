name: LT500D R25 emulator gate

permissions:
  contents: write

concurrency:
  group: lt500d-r25-emulator
  cancel-in-progress: true

on:
  push:
    branches:
      - lt500d-r25-emulator-v1
    paths:
      - "scripts/**"
      - "profiles/lt500d-r25/**"
      - ".github/workflows/lt500d-r25-emulator.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-mips qemu-utils squashfs-tools e2fsprogs unzip curl python3 libdigest-sha-perl

      - name: Download official Cudy R25 2.4.16 firmware
        id: firmware
        run: |
          set -euo pipefail
          URL='https://www.cudy.com/cdn/shop/files/LT500V2-R25-2.4.16-20250804-150319-flash.zip?v=5016960833307663900'
          curl -fL --retry 4 --retry-delay 2 -o /tmp/lt500d-r25.zip "$URL"
          unzip -l /tmp/lt500d-r25.zip
          mkdir -p /tmp/lt500d-r25-fw
          unzip -j /tmp/lt500d-r25.zip -d /tmp/lt500d-r25-fw
          FLASH="$(find /tmp/lt500d-r25-fw -type f -name '*flash.bin' | head -1)"
          test -n "$FLASH"
          test "$(stat -c %s "$FLASH")" = "12124315"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  $FLASH" | sha256sum -c -
          cp "$FLASH" /tmp/LT500V2-R25-2.4.16-20250804-150319-flash.bin

      - name: Build emulator image from verified donor
        id: build
        run: |
          set -euo pipefail
          bash scripts/make.lt500d-r25-emulator.macos.sh             /tmp/LT500V2-R25-2.4.16-20250804-150319-flash.bin             scratch/lt500d-r25

      - name: Boot QEMU and wait for Cudy HTTP
        id: gate
        run: |
          set -euo pipefail
          rm -f scratch/lt500d-r25/qemu.serial.log /tmp/lt500d-r25-http-body.bin*
          bash scripts/start.lt500d-r25.sh scratch/lt500d-r25/image.raw &
          QEMU_PID=$!
          echo "$QEMU_PID" > /tmp/lt500d-r25-qemu.pid

          transport_ok=0
          asset_url=http://127.0.0.1:8080/luci-static/bootstrap/js/sysauth.js
          for i in $(seq 1 60); do
            if curl -sS --connect-timeout 0.5 --max-time 1 -D /tmp/lt500d-r25-static.bin.headers -o /tmp/lt500d-r25-static.bin "$asset_url" && [ -s /tmp/lt500d-r25-static.bin ]; then
              transport_ok=1
              echo "LT500D_STATIC_HTTP_GATE=PASS"
              head -n 1 /tmp/lt500d-r25-static.bin.headers || true
              wc -c /tmp/lt500d-r25-static.bin
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited before HTTP gate"
              break
            fi
            sleep 1
          done

          root_ok=0
          luci_ok=0
          https_ok=0
          lan_ok=0
          if [ "$transport_ok" -eq 1 ]; then
            echo "Probing donor root"
            root_status="$(curl -sS --connect-timeout 1 --max-time 10 -w '%{http_code}' -D /tmp/lt500d-r25-http-body.bin.headers -o /tmp/lt500d-r25-http-body.bin http://127.0.0.1:8080/ || true)"
            echo "$root_status" > /tmp/lt500d-r25-root.status
            if [ "$root_status" = "200" ] && grep -q 'cgi-bin/luci/' /tmp/lt500d-r25-http-body.bin; then
              root_ok=1
              echo "LT500D_ROOT_REDIRECT_GATE=PASS status=$root_status"
            fi

            echo "Probing donor LuCI CGI from root-declared route"
            root_luci_path="$(grep -Eo '/?cgi-bin/luci[^"'"'"'<>[:space:]]*' /tmp/lt500d-r25-http-body.bin | head -n1 || true)"
            [ -n "$root_luci_path" ] || root_luci_path="/cgi-bin/luci"
            case "$root_luci_path" in
              /*) ;;
              *) root_luci_path="/$root_luci_path" ;;
            esac
            echo "root_luci_path=$root_luci_path"
            printf '%s\n' "$root_luci_path" > /tmp/lt500d-r25-luci.path

            luci_ok=0
            : > /tmp/lt500d-r25-luci-attempts.txt
            for candidate in "$root_luci_path" "${root_luci_path%/}" "/cgi-bin/luci" "/cgi-bin/luci/admin"; do
              [ -n "$candidate" ] || continue
              grep -Fxq "$candidate" /tmp/lt500d-r25-luci-attempts.txt 2>/dev/null && continue
              echo "$candidate" >> /tmp/lt500d-r25-luci-attempts.txt
              safe="$(printf '%s' "$candidate" | tr '/?&=' '____')"
              status="$(curl -sS -L --connect-timeout 1 --max-time 15 -w '%{http_code}'                 -D "/tmp/lt500d-r25-luci${safe}.headers"                 -o "/tmp/lt500d-r25-luci${safe}.bin"                 "http://127.0.0.1:8080$candidate" || true)"
              printf '%s %s\n' "$status" "$candidate" >> /tmp/lt500d-r25-luci-attempts.txt
              echo "LuCI candidate $candidate -> $status"
              if [ "$status" != "200" ]; then
                echo "--- LuCI candidate body head: $candidate ---"
                head -c 900 "/tmp/lt500d-r25-luci${safe}.bin" 2>/dev/null || true
                echo
                echo "--- LuCI candidate headers: $candidate ---"
                head -n 20 "/tmp/lt500d-r25-luci${safe}.headers" 2>/dev/null || true
              fi
              if [ "$status" = "200" ] &&
                 [ -s "/tmp/lt500d-r25-luci${safe}.bin" ] &&
                 grep -Eqi '<html|<!DOCTYPE|Cudy|sysauth|login|Dashboard' "/tmp/lt500d-r25-luci${safe}.bin"; then
                luci_ok=1
                cp "/tmp/lt500d-r25-luci${safe}.headers" /tmp/lt500d-r25-luci.bin.headers
                cp "/tmp/lt500d-r25-luci${safe}.bin" /tmp/lt500d-r25-luci.bin
                printf '%s' "$status" > /tmp/lt500d-r25-luci.status
                printf '%s' "$candidate" > /tmp/lt500d-r25-luci.resolved-path
                echo "LT500D_LUCI_CGI_GATE=PASS final_status=$status path=$candidate"
                head -n 8 /tmp/lt500d-r25-luci.bin.headers || true
                wc -c /tmp/lt500d-r25-luci.bin
                break
              fi
            done
            if [ "$luci_ok" -ne 1 ]; then
              printf '%s' "000" > /tmp/lt500d-r25-luci.status
              echo "LT500D_LUCI_CGI_GATE=FAIL no_candidate_returned_valid_200_html"
              cat /tmp/lt500d-r25-luci-attempts.txt || true
            fi

            echo "Probing donor HTTPS static asset"
            https_status="$(curl -k -sS --connect-timeout 1 --max-time 10 -w '%{http_code}' -D /tmp/lt500d-r25-https.bin.headers -o /tmp/lt500d-r25-https.bin https://127.0.0.1:8443/luci-static/bootstrap/js/sysauth.js || true)"
            echo "$https_status" > /tmp/lt500d-r25-https.status
            if [ "$https_status" = "200" ] && [ -s /tmp/lt500d-r25-https.bin ]; then
              https_ok=1
              echo "LT500D_HTTPS_GATE=PASS status=$https_status"
            else
              echo "LT500D_HTTPS_GATE=FAIL status=$https_status"
            fi

            if grep -q 'LT500D_LAN_UCI_GATE=PASS network.lan.ipaddr=192.168.10.2' scratch/lt500d-r25/qemu.serial.log &&
               grep -q 'LT500D_LAN_IP_GATE=PASS br-lan=192.168.10.2' scratch/lt500d-r25/qemu.serial.log; then
              lan_ok=1
              echo "LT500D_LAN_RUNTIME_GATE=PASS"
            fi
          fi

          echo "=== serial tail ==="
          tail -n 250 scratch/lt500d-r25/qemu.serial.log || true
          echo "=== process ==="
          ps -fp "$QEMU_PID" || true

          if [ "$transport_ok" -ne 1 ]; then
            echo "FAIL: hostfwd/static donor HTTP transport unavailable"
            exit 1
          fi
          if [ "$root_ok" -ne 1 ]; then
            echo "FAIL: donor root did not return the expected LuCI redirect"
            exit 1
          fi
          if [ "$luci_ok" -ne 1 ]; then
            echo "FAIL: donor LuCI CGI did not return an allowed non-error status with recognizable HTML"
            exit 1
          fi
          if [ "$https_ok" -ne 1 ]; then
            echo "FAIL: donor HTTPS static asset unavailable"
            exit 1
          fi
          if [ "$lan_ok" -ne 1 ]; then
            echo "FAIL: runtime LAN identity is not verified as 192.168.10.2"
            exit 1
          fi

          echo "LT500D_HTTP_GATE=PASS"
          echo "LT500D_HTTPS_GATE=PASS"
          echo "LT500D_EMULATOR_GATE=PASS"

      - name: Stop QEMU
        if: always()
        run: |
          if [ -f /tmp/lt500d-r25-qemu.pid ]; then
            kill "$(cat /tmp/lt500d-r25-qemu.pid)" 2>/dev/null || true
          fi

      - name: Persist emulator evidence
        if: always()
        env:
          FIRMWARE_OUTCOME: ${{ steps.firmware.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set +e
          mkdir -p evidence
          SERIAL=evidence/RE-LT500D-R25-qemu.serial.log
          RESULT=evidence/RE-LT500D-R25-EMULATOR-CI-RESULT.md
          if [ -f scratch/lt500d-r25/qemu.serial.log ]; then
            cp scratch/lt500d-r25/qemu.serial.log "$SERIAL"
          else
            : > "$SERIAL"
          fi
          {
            echo '# RE-LT500D R25 emulator CI result'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Firmware download/verify: $FIRMWARE_OUTCOME"
            echo "Image build: $BUILD_OUTCOME"
            echo "QEMU/HTTP gate: $GATE_OUTCOME"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f /tmp/lt500d-r25-http-body.bin.headers ]; then
              echo '## HTTP headers'
              echo '```text'
              head -n 40 /tmp/lt500d-r25-http-body.bin.headers
              echo '```'
            fi
            if [ -f /tmp/lt500d-r25-http-body.bin ]; then
              echo
              echo '## HTTP body summary'
              echo '```text'
              wc -c /tmp/lt500d-r25-http-body.bin
              file /tmp/lt500d-r25-http-body.bin || true
              echo '```'
            fi
            echo
            echo '## Gate status'
            echo '```text'
            [ -f /tmp/lt500d-r25-root.status ] && echo "root=$(cat /tmp/lt500d-r25-root.status)"
            [ -f /tmp/lt500d-r25-luci.status ] && echo "luci_final=$(cat /tmp/lt500d-r25-luci.status)"
            [ -f /tmp/lt500d-r25-luci.resolved-path ] && echo "luci_path=$(cat /tmp/lt500d-r25-luci.resolved-path)"
            [ -f /tmp/lt500d-r25-luci-attempts.txt ] && cat /tmp/lt500d-r25-luci-attempts.txt
            [ -f /tmp/lt500d-r25-https.status ] && echo "https_static=$(cat /tmp/lt500d-r25-https.status)"
            grep -E 'LT500D_(LAN_UCI|LAN_IP)_GATE=PASS' "$SERIAL" | tail -n 4 || true
            echo '```'
            echo
            echo '## Serial tail'
            echo '```text'
            tail -n 220 "$SERIAL"
            echo '```'
          } > "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/RE-LT500D-R25-EMULATOR-CI-RESULT.md evidence/RE-LT500D-R25-qemu.serial.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record LT500D R25 emulator CI evidence'
            git push origin HEAD:lt500d-r25-emulator-v1 || true
          fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-LT500D-R25-EMULATOR-EVIDENCE
          if-no-files-found: ignore
          path: |
            scratch/lt500d-r25/qemu.serial.log
            /tmp/lt500d-r25-http-body.bin
            /tmp/lt500d-r25-http-body.bin.headers
            /tmp/lt500d-r25-static.bin
            /tmp/lt500d-r25-static.bin.headers
            /tmp/lt500d-r25-luci.bin
            /tmp/lt500d-r25-luci.bin.headers
            /tmp/lt500d-r25-luci.status
            /tmp/lt500d-r25-luci.path
            /tmp/lt500d-r25-luci.resolved-path
            /tmp/lt500d-r25-luci-attempts.txt
            /tmp/lt500d-r25-root.status
            /tmp/lt500d-r25-https.bin
            /tmp/lt500d-r25-https.bin.headers
            /tmp/lt500d-r25-https.status
