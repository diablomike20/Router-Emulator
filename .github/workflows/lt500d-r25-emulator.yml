name: LT500D R25 emulator gate

permissions:
  contents: write

on:
  push:
    branches:
      - lt500d-r25-emulator-v1
    paths:
      - "scripts/**"
      - "profiles/lt500d-r25/**"
      - ".github/workflows/lt500d-r25-emulator.yml"
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-mips qemu-utils squashfs-tools e2fsprogs unzip curl python3 libdigest-sha-perl

      - name: Download official Cudy R25 2.4.16 firmware
        id: firmware
        run: |
          set -euo pipefail
          URL='https://www.cudy.com/cdn/shop/files/LT500V2-R25-2.4.16-20250804-150319-flash.zip?v=5016960833307663900'
          curl -fL --retry 4 --retry-delay 2 -o /tmp/lt500d-r25.zip "$URL"
          unzip -l /tmp/lt500d-r25.zip
          mkdir -p /tmp/lt500d-r25-fw
          unzip -j /tmp/lt500d-r25.zip -d /tmp/lt500d-r25-fw
          FLASH="$(find /tmp/lt500d-r25-fw -type f -name '*flash.bin' | head -1)"
          test -n "$FLASH"
          test "$(stat -c %s "$FLASH")" = "12124315"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  $FLASH" | sha256sum -c -
          cp "$FLASH" /tmp/LT500V2-R25-2.4.16-20250804-150319-flash.bin

      - name: Inspect donor board detection
        run: |
          set -euo pipefail
          FLASH=/tmp/LT500V2-R25-2.4.16-20250804-150319-flash.bin
          mkdir -p /tmp/lt500d-inspect
          dd if="$FLASH" of=/tmp/lt500d-inspect/root.squashfs bs=1 skip=$((0x2a7d4d)) status=none
          unsquashfs -cat /tmp/lt500d-inspect/root.squashfs lib/ramips.sh 2>/dev/null | sed -n '1,220p'
          echo '=== factory hook ==='
          unsquashfs -cat /tmp/lt500d-inspect/root.squashfs lib/preinit/82_factory_mac 2>/dev/null | sed -n '1,180p'

      - name: Build emulator image from verified donor
        id: build
        run: |
          set -euo pipefail
          bash scripts/make.lt500d-r25-emulator.macos.sh             /tmp/LT500V2-R25-2.4.16-20250804-150319-flash.bin             scratch/lt500d-r25

      - name: Boot QEMU and wait for Cudy HTTP
        id: gate
        run: |
          set -euo pipefail
          rm -f scratch/lt500d-r25/qemu.serial.log /tmp/lt500d-r25-http-body.bin*
          bash scripts/start.lt500d-r25.sh scratch/lt500d-r25/image.raw &
          QEMU_PID=$!
          echo "$QEMU_PID" > /tmp/lt500d-r25-qemu.pid

          ok=0
          for i in $(seq 1 90); do
            if bash scripts/smoke.lt500d-r25-http.sh /tmp/lt500d-r25-http-body.bin; then
              ok=1
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              echo "QEMU exited before HTTP gate"
              break
            fi
            sleep 2
          done

          echo "=== serial tail ==="
          tail -n 250 scratch/lt500d-r25/qemu.serial.log || true
          echo "=== process ==="
          ps -fp "$QEMU_PID" || true

          if [ "$ok" -ne 1 ]; then
            exit 1
          fi

          echo "LT500D_HTTP_GATE=PASS"

      - name: Stop QEMU
        if: always()
        run: |
          if [ -f /tmp/lt500d-r25-qemu.pid ]; then
            kill "$(cat /tmp/lt500d-r25-qemu.pid)" 2>/dev/null || true
          fi

      - name: Persist emulator evidence
        if: always()
        env:
          FIRMWARE_OUTCOME: ${{ steps.firmware.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          set +e
          mkdir -p evidence
          SERIAL=evidence/RE-LT500D-R25-qemu.serial.log
          RESULT=evidence/RE-LT500D-R25-EMULATOR-CI-RESULT.md
          if [ -f scratch/lt500d-r25/qemu.serial.log ]; then
            cp scratch/lt500d-r25/qemu.serial.log "$SERIAL"
          else
            : > "$SERIAL"
          fi
          {
            echo '# RE-LT500D R25 emulator CI result'
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Firmware download/verify: $FIRMWARE_OUTCOME"
            echo "Image build: $BUILD_OUTCOME"
            echo "QEMU/HTTP gate: $GATE_OUTCOME"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            if [ -f /tmp/lt500d-r25-http-body.bin.headers ]; then
              echo '## HTTP headers'
              echo '```text'
              head -n 40 /tmp/lt500d-r25-http-body.bin.headers
              echo '```'
            fi
            if [ -f /tmp/lt500d-r25-http-body.bin ]; then
              echo
              echo '## HTTP body summary'
              echo '```text'
              wc -c /tmp/lt500d-r25-http-body.bin
              file /tmp/lt500d-r25-http-body.bin || true
              echo '```'
            fi
            echo
            echo '## Serial tail'
            echo '```text'
            tail -n 220 "$SERIAL"
            echo '```'
          } > "$RESULT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/RE-LT500D-R25-EMULATOR-CI-RESULT.md evidence/RE-LT500D-R25-qemu.serial.log
          if ! git diff --cached --quiet; then
            git commit -m 'Record LT500D R25 emulator CI evidence'
            git push origin HEAD:lt500d-r25-emulator-v1 || true
          fi
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-LT500D-R25-EMULATOR-EVIDENCE
          if-no-files-found: ignore
          path: |
            scratch/lt500d-r25/qemu.serial.log
            /tmp/lt500d-r25-http-body.bin
            /tmp/lt500d-r25-http-body.bin.headers
