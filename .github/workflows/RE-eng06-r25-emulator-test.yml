name: RE ENG06 LT500D R25 emulator test

permissions:
  contents: read

on:
  push:
    branches:
      - re-eng06-emulator-test
  workflow_dispatch:

jobs:
  eng06-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install emulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-mips qemu-utils squashfs-tools e2fsprogs unzip curl python3 libdigest-sha-perl sshpass netcat-openbsd liblzo2-dev liblzma-dev libzstd-dev

      - name: Download verified stock R25 firmware
        run: |
          set -euo pipefail
          URL='https://www.cudy.com/cdn/shop/files/LT500V2-R25-2.4.16-20250804-150319-flash.zip?v=5016960833307663900'
          curl -fL --retry 4 --retry-delay 2 -o /tmp/r25.zip "$URL"
          mkdir -p /tmp/r25-fw
          unzip -j /tmp/r25.zip -d /tmp/r25-fw
          FLASH="$(find /tmp/r25-fw -type f -name '*flash.bin' | head -1)"
          test -n "$FLASH"
          test "$(stat -c %s "$FLASH")" = "12124315"
          echo "57aed945a9f485d178d73a844e420fc2b441e60821e243d3d19d07dd4a3143d6  $FLASH" | sha256sum -c -
          cp "$FLASH" /tmp/R25-stock.bin

      - name: Build corrected ENG06 full image from patched rootfs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct
          b=Path('/tmp/R25-stock.bin').read_bytes()
          roff=0x2a7d4d
          used=struct.unpack('<Q',b[roff+40:roff+48])[0]
          Path('/tmp/R25-stock-rootfs.squashfs').write_bytes(b[roff:roff+used])
          print('stock_rootfs_offset',hex(roff),'bytes_used',hex(used))
          PY
          sudo rm -rf /tmp/eng06-rootfs
          sudo unsquashfs -d /tmp/eng06-rootfs /tmp/R25-stock-rootfs.squashfs
          sudo python3 scripts/RE-LT500V2-R25-ENG06-rootfs-patch.py /tmp/eng06-rootfs 2>&1 | tee /tmp/eng06-build.log
          sudo rm -f /tmp/R25-ENG06-rootfs.squashfs
          git clone --depth 1 https://github.com/plougher/squashfs-tools.git /tmp/squashfs-tools
          make -C /tmp/squashfs-tools/squashfs-tools LZMA_XZ_SUPPORT=1 XZ_SUPPORT=1 mksquashfs
          sudo /tmp/squashfs-tools/squashfs-tools/mksquashfs /tmp/eng06-rootfs /tmp/R25-ENG06-rootfs.squashfs -nopad -noappend -root-owned -comp xz -Xdict-size 100% -b 524288 -processors 1 -no-xattrs -always-use-fragments -no-progress
          sudo chmod 0644 /tmp/R25-ENG06-rootfs.squashfs
          rm -rf /tmp/eng06-reextract
          sudo unsquashfs -d /tmp/eng06-reextract /tmp/R25-ENG06-rootfs.squashfs >/tmp/eng06-reextract.log
          test -x /tmp/eng06-reextract/sbin/procd

          python3 - <<'PY'
          from pathlib import Path
          import struct
          stock=bytearray(Path('/tmp/R25-stock.bin').read_bytes())
          sq=Path('/tmp/R25-ENG06-rootfs.squashfs').read_bytes()
          roff=0x2a7d4d
          # Physical-router safety: rebuilt SquashFS must stop before the stock 0xb60000 deadc0de eraseblock marker.
          limit=0xb60000
          if len(sq) > limit-roff:
              raise SystemExit(f'rebuilt SquashFS too large: {len(sq)} > {limit-roff}')
          # Preserve stock post-SquashFS eraseblock padding/JFFS2 EOF markers.
          # Only overwrite the new SquashFS bytes; do not zero the remainder.
          stock[roff:roff+len(sq)]=sq
          sysup=bytearray(stock[0x50000:])

          # Rebuild fwtool metadata for both the native Cudy board ID and OpenWrt 23.05 device ID.
          meta=sysup.rfind(b'\xde\xad\xc0\xde')
          trailer=sysup.rfind(b'FWx0')
          if meta < 0 or trailer < 0 or len(sysup)-trailer != 16 or meta >= trailer:
              raise SystemExit('fwtool metadata/trailer not found')
          # Keep the stock fwtool metadata payload length exactly 127 bytes so the complete
          # full-flash image remains byte-for-byte the stock size/layout.  Both device IDs are
          # advertised; non-essential board text is omitted and the JSON is whitespace-padded.
          info=b'{"supported_devices":["cudy,lt500-v2","R25"],"version":{"dist":"LEDE","version":"17.01.5","revision":"2.4.16"}}'
          info=info + b' '*(126-len(info)) + b'\n'
          if len(info) != 127:
              raise SystemExit(f'unexpected fwtool info length: {len(info)}')
          sysup=bytearray(sysup[:meta+12] + info + sysup[trailer:])
          trailer=sysup.rfind(b'FWx0')
          total_meta_len=len(sysup)-meta-4
          sysup[trailer+9:trailer+16]=total_meta_len.to_bytes(7,'big')

          table=[]
          for n in range(256):
              crc=n
              for _ in range(8):
                  crc=(crc>>1)^0xedb88320 if crc&1 else crc>>1
              table.append(crc)
          val=0xffffffff
          for x in sysup[:trailer]:
              val=table[(val&0xff)^x]^(val>>8)
          sysup[trailer+4:trailer+8]=struct.pack('>I',val&0xffffffff)

          # Exact router-test sysupgrade + matching full image for emulator validation.
          stock=bytearray(stock[:0x50000] + sysup)
          Path('/tmp/R25-ENG07-router-safe-full-test.bin').write_bytes(stock)
          Path('/tmp/RE-LT500V2-R25-ENG07-router-safe-sysupgrade.bin').write_bytes(sysup)
          print('repacked_rootfs_file_size',len(sq),'limit',limit-roff)
          print('router_safe_sysupgrade_size',len(sysup),'metadata_offset',hex(meta),'trailer_offset',hex(trailer))
          print('preserved_marker_b20000',sysup[0xb20000:0xb20004].hex())
          PY
          sha256sum /tmp/R25-ENG07-router-safe-full-test.bin /tmp/RE-LT500V2-R25-ENG07-router-safe-sysupgrade.bin

      - name: Build stock-IP emulator image from ENG06
        run: |
          set -euo pipefail
          export LT500D_ALLOW_MODIFIED_IMAGE=1
          bash scripts/make.lt500d-r25-emulator.macos.sh /tmp/R25-ENG07-router-safe-full-test.bin scratch/eng06
          grep -F "192.168.10.1" scratch/eng06/rootfs/etc/uci-defaults/01_network
          ! grep -Fq "192.168.10.2" scratch/eng06/rootfs/etc/uci-defaults/01_network

      - name: Boot ENG06 and run runtime gates
        run: |
          set -euo pipefail
          rm -f scratch/eng06/qemu.serial.log
          LT500D_SERIAL_LOG="$PWD/scratch/eng06/qemu.serial.log" bash scripts/start.lt500d-r25.sh scratch/eng06/image.raw &
          QEMU_PID=$!
          echo "$QEMU_PID" >/tmp/eng06-qemu.pid

          ok=0
          for i in $(seq 1 150); do
            if curl -sS --connect-timeout 0.5 --max-time 1 -o /tmp/sysauth.js http://127.0.0.1:8080/luci-static/bootstrap/js/sysauth.js && [ -s /tmp/sysauth.js ]; then
              ok=1
              break
            fi
            kill -0 "$QEMU_PID" 2>/dev/null || break
            sleep 1
          done
          test "$ok" = 1

          bash scripts/smoke.lt500d-r25-http.sh /tmp/eng06-http

          grep -F "LT500D_LAN_UCI_GATE=PASS network.lan.ipaddr=192.168.10.1" scratch/eng06/qemu.serial.log
          grep -F "LT500D_LAN_IP_GATE=PASS br-lan=192.168.10.1" scratch/eng06/qemu.serial.log

          for i in $(seq 1 60); do
            nc -z 127.0.0.1 2222 && break
            sleep 1
          done
          nc -z 127.0.0.1 2222
          nc -z 127.0.0.1 2323

          SSHPASS='wiE1qkzbFQDARh0K84HTwi' sshpass -e ssh             -p 2222             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o HostKeyAlgorithms=+ssh-rsa             -o PubkeyAcceptedAlgorithms=+ssh-rsa             -o ConnectTimeout=8             root@127.0.0.1             'echo ENG06_ROOT_SSH=PASS; id; echo "---network---"; uci -q get network.lan.ipaddr; echo "---luci---"; uci -q get luci.main.showuser; echo "---service-gates---"; pidof dropbear >/dev/null && echo ENG06_DROPBEAR_RUNNING=PASS || echo ENG06_DROPBEAR_RUNNING=FAIL; pidof telnetd >/dev/null && echo ENG06_TELNETD_RUNNING=PASS || echo ENG06_TELNETD_RUNNING=FAIL; /etc/init.d/dropbear enabled >/dev/null 2>&1 && echo ENG06_DROPBEAR_ENABLED=PASS || echo ENG06_DROPBEAR_ENABLED=FAIL; /etc/init.d/telnet enabled >/dev/null 2>&1 && echo ENG06_TELNET_ENABLED=PASS || echo ENG06_TELNET_ENABLED=FAIL; pidof hcshd >/dev/null 2>&1 && echo ENG06_HCSHD_DISABLED=FAIL || echo ENG06_HCSHD_DISABLED=PASS; echo "---cwmp---"; CWMP=$(uci -q get cwmp.info.enable || true); echo "$CWMP"; [ "$CWMP" = off ] && echo ENG06_CWMP_DEFAULT_OFF=PASS || echo ENG06_CWMP_DEFAULT_OFF=FAIL; (pidof cwmp >/dev/null 2>&1 || pidof tr069 >/dev/null 2>&1) && echo ENG06_CWMP_DAEMONS_STOPPED=FAIL || echo ENG06_CWMP_DAEMONS_STOPPED=PASS; echo "---autoupgrade---"; ps w | grep -q "[a]utoupgrade" && echo ENG06_AUTOUPGRADE_STOPPED=FAIL || echo ENG06_AUTOUPGRADE_STOPPED=PASS; echo "---listeners---"; netstat -lnt 2>/dev/null || true; echo "---rpcd---"; uci show rpcd 2>/dev/null || true; echo "---accounts---"; grep "^admin:" /etc/passwd /etc/shadow 2>/dev/null || true'             | tee /tmp/eng06-runtime.txt

          grep -F "ENG06_ROOT_SSH=PASS" /tmp/eng06-runtime.txt
          grep -Fx "192.168.10.1" /tmp/eng06-runtime.txt
          grep -Fx "1" /tmp/eng06-runtime.txt
          grep -F "ENG06_DROPBEAR_RUNNING=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_TELNETD_RUNNING=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_DROPBEAR_ENABLED=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_TELNET_ENABLED=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_HCSHD_DISABLED=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_CWMP_DEFAULT_OFF=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_CWMP_DAEMONS_STOPPED=PASS" /tmp/eng06-runtime.txt
          grep -F "ENG06_AUTOUPGRADE_STOPPED=PASS" /tmp/eng06-runtime.txt
          if grep -q '[h]cshd' /tmp/eng06-runtime.txt; then
            echo "FAIL: hcshd unexpectedly running"
            exit 1
          fi

          curl -sS --connect-timeout 2 --max-time 10 -H 'Host: cudy.net' -D /tmp/eng06-luci.headers -o /tmp/eng06-luci.html http://127.0.0.1:8080/cgi-bin/luci/ || true
          grep -Eqi 'Cudy|sysauth|Create an administrator password|Username|Password' /tmp/eng06-luci.html
          echo ENG06_WEB_LOGIN_PAGE=PASS

      - name: Stop QEMU
        if: always()
        run: |
          if [ -f /tmp/eng06-qemu.pid ]; then
            kill "$(cat /tmp/eng06-qemu.pid)" 2>/dev/null || true
          fi

      - name: Upload ENG06 emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-LT500V2-R25-ENG06-EMULATOR-EVIDENCE
          if-no-files-found: ignore
          path: |
            /tmp/RE-LT500V2-R25-ENG07-router-safe-sysupgrade.bin
            /tmp/R25-ENG07-router-safe-full-test.bin
            /tmp/eng06-build.log
            /tmp/eng06-runtime.txt
            /tmp/eng06-luci.headers
            /tmp/eng06-luci.html
            /tmp/eng06-http*
            scratch/eng06/qemu.serial.log
