name: RE F9K1103 v1 RT3883 U-Boot emulator M1

concurrency:
  group: re-f9k1103-rt3883-m1-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [f9k1103-v1-rt3883-uboot-emulator-m1, f9k1103-v1-rt3883-uboot-emulator-m1-smi-wip]
    paths:
      - 'qemu/f9k1103-v1-rt3883/**'
      - 'scripts/RE-build-qemu-f9k1103-v1-rt3883.sh'
      - 'scripts/RE-smoke-qemu-f9k1103-v1-rt3883.sh'
      - 'scripts/RE-run-exact-f9k1103-v1-rt3883-m1.sh'
      - 'profiles/f9k1103-v1-rt3883-uboot/**'
      - 'evidence/RE-F9K1103-V1-RT3883-QEMU-SOURCE-TRUTH.md'
      - 'evidence/RE-F9K1103-V1-RT3883-QEMU-M1-TRUTH.md'
      - '.github/workflows/RE-f9k1103-v1-rt3883-uboot-emulator.yml'
jobs:
  qemu-rt3883-m1-prep:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ninja-build pkg-config python3 python3-venv libglib2.0-dev libpixman-1-dev zlib1g-dev gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
      - name: Build custom QEMU RT3883 machine
        run: |
          set -o pipefail
          chmod +x scripts/RE-build-qemu-f9k1103-v1-rt3883.sh
          scripts/RE-build-qemu-f9k1103-v1-rt3883.sh "$RUNNER_TEMP/rt3883-qemu" | tee "$RUNNER_TEMP/RE-qemu-build.log"
      - name: Run RT3883 machine M1-prep smoke gates
        run: |
          set -o pipefail
          chmod +x scripts/RE-smoke-qemu-f9k1103-v1-rt3883.sh
          scripts/RE-smoke-qemu-f9k1103-v1-rt3883.sh "$RUNNER_TEMP/rt3883-qemu/build/qemu-system-mipsel" "$RUNNER_TEMP/rt3883-smoke" | tee "$RUNNER_TEMP/RE-qemu-smoke.log"
      - name: Build provenance
        if: always()
        run: |
          {
            echo "hardware=Belkin F9K1103 v1"
            echo "soc=Ralink RT3883"
            echo "phase=M1_EXACT_UBOOT_PREPARATION"
            echo "syscfg0_evidence=bits_17_9_8_DDR2_500MHz"
            echo "system_reset=RSTCTRL_bit0"
            echo "spi_reset=RSTCTRL_bit18"
            echo "fe_reset=RSTCTRL_bit21"
            echo "exact_mtd_fixture=LOCAL_PRIVATE_NOT_IN_REPO"
            echo "qemu_tag=v8.2.10"
            echo "physical_hardware_claim=NO"
            echo "bootrom_fidelity=DIRECT_UBOOT_ENTRY_SHIM"
            echo "cpu_fidelity=QEMU_74KF_TEMPORARY__PHYSICAL_PRID_0001974C_CACHE_GEOMETRY_KNOWN"
            echo "source_sha=$GITHUB_SHA"
          } > "$RUNNER_TEMP/RE-PROVENANCE.txt"
      - name: Upload M1-prep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RE-F9K1103-V1-RT3883-QEMU-M1-PREP-EVIDENCE
          retention-days: 90
          path: |
            ${{ runner.temp }}/RE-qemu-build.log
            ${{ runner.temp }}/RE-qemu-smoke.log
            ${{ runner.temp }}/RE-PROVENANCE.txt
            ${{ runner.temp }}/rt3883-qemu/build/qemu-system-mipsel
            ${{ runner.temp }}/rt3883-smoke/serial.log
            ${{ runner.temp }}/rt3883-smoke/probe.bin
